# Every push: build the C# project, run the smoke tests (offline, then two clients over a fake bad
# connection), and export a Windows build you can download from the run's page (Artifacts).
name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Must match the editor everyone uses (and Godot.NET.Sdk in game/RND.csproj).
  GODOT_VERSION: "4.7"
  GODOT_RELEASE: "stable"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash # with pipefail, so a test piped through tee still fails its step
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache Godot and its export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}-mono

      - name: Download Godot (.NET) and its export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}
          name=Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_mono
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "$base/${name}_linux_x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          curl -fsSL -o /tmp/templates.tpz "$base/${name}_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          templates=~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}.mono
          mkdir -p "$templates"
          mv /tmp/templates/templates/* "$templates/"

      - name: Put Godot on the path
        run: |
          dir=~/godot/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_mono_linux_x86_64
          echo "GODOT=$dir/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_mono_linux.x86_64" >> "$GITHUB_ENV"

      - name: Build the C# project
        run: dotnet build game/RND.sln

      # .godot/ (the import cache) isn't in git, so import everything once first.
      - name: Import assets
        working-directory: game
        run: timeout 600 "$GODOT" --headless --import

      # Every run is wrapped in a timeout: if a test script fails to parse, Godot never quits.
      - name: Smoke test (offline)
        working-directory: game
        run: timeout 300 "$GODOT" --headless res://tests/smoke_test.tscn -- --role=scenes --timeout=280 2>&1 | tee "$RUNNER_TEMP/offline.log"

      - name: Smoke test (network, 2 clients at 150 ms with 2% loss)
        working-directory: game
        run: timeout 420 "$GODOT" --headless res://tests/smoke_test.tscn -- --role=network --clients=2 --ping=150 --jitter=20 --loss=2 --out="$RUNNER_TEMP" 2>&1 | tee "$RUNNER_TEMP/network.log"

      # Reading a run's logs needs a GitHub sign-in, so this also puts the end of each test log on
      # the run's summary page, as an error note.
      - name: Show the end of the test logs
        if: failure()
        run: |
          for log in "$RUNNER_TEMP"/*.log; do
            [ -f "$log" ] || continue
            body=$(grep -v '^\s*$' "$log" | tail -n 40 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=$(basename "$log")::$body"
          done

      - name: Keep the network test's client logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: network-test-logs
          path: ${{ runner.temp }}/client_*.log
          if-no-files-found: ignore

      - name: Export the Windows build
        working-directory: game
        run: |
          mkdir -p ../builds/windows
          timeout 900 "$GODOT" --headless --export-release "Windows" ../builds/windows/RND.exe
          test -f ../builds/windows/RND.exe

      - name: Upload the Windows build
        uses: actions/upload-artifact@v4
        with:
          name: RND-windows
          path: builds/windows
